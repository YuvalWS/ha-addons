name: HA RO MCP
version: "2.3.0-1"
slug: ha_ro_mcp
description: Read-only (RO) MCP server - states, templates, logs and registries for an AI agent
url: https://github.com/YuvalWS/ha-addons/tree/main/ha_ro_mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
options:
  public_hostname: ""
  mcp_auth_token: ""
schema:
  public_hostname: str
  mcp_auth_token: password
